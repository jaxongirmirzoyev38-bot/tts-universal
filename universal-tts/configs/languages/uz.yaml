language: "uz"
name: "Uzbek"
scripts:
  - "Latin"
  - "Cyrillic"
stress_rule: "ultimate_syllable"
digraphs:
  - "o'"
  - "g'"
  - "sh"
  - "ch"
  - "ng"
ipa_mappings:
  "o'": "ø"
  "g'": "ʁ"
  "sh": "ʃ"
  "ch": "t͡ʃ"
  "ng": "ŋ"
  "a": "ɑ"
  "e": "e"
  "i": "i"
  "o": "ɔ"
  "u": "u"
  "q": "q"
  "x": "χ"
  "h": "h"
  "j": "d͡ʒ"
dialects:
  - "Tashkent (Standard)"
  - "Samarkand"
  - "Fergana"
  - "Khorezm"
default_voice: "uz_male_01"
