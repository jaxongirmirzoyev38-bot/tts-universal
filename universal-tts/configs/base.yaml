# Universal TTS Base Configuration

acoustic_model:
  type: "FlowMatchingDiT"
  hidden_size: 768
  num_layers: 16
  num_heads: 12
  ffn_dim: 3072
  dropout: 0.1
  cfg_scale: 1.8
  latent_dim: 80
  time_steps: 32

speaker_encoder:
  architecture: "ECAPA-TDNN"
  embedding_dim: 512
  channels: 1024
  pooling: "AttentiveStatsPool"

vocoder:
  type: "HiFi-GAN"
  sample_rate: 24000
  hop_length: 256
  win_length: 1024
  n_fft: 1024
  n_mels: 80
  f_min: 0
  f_max: 12000

training:
  batch_size: 32
  learning_rate: 0.0001
  warmup_steps: 10000
  max_steps: 250000
  precision: "bf16-mixed"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2
